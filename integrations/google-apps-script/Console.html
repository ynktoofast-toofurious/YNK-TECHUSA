<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b1120; --panel: #111a2e; --panel-2: #16213a; --line: rgba(255,255,255,.08);
    --text: #f1f5f9; --muted: #94a3b8; --accent: #29B5E8; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: rgba(11,17,32,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 24px 120px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--text); background: rgba(41,181,232,.14); border-color: rgba(41,181,232,.4); }
  .count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #04121c; font-size: 11px; line-height: 20px; text-align: center; }
  .count:empty { display: none; }
  .card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .card.click { cursor: pointer; transition: border-color .2s; }
  .card.click:hover { border-color: rgba(41,181,232,.45); }
  .card .grow { flex: 1; min-width: 0; }
  .card h3 { margin: 0 0 2px; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; border: 1px solid var(--line); color: var(--muted); }
  .badge.study { color: #fbbf24; border-color: rgba(251,191,36,.35); }
  .badge.article { color: #a78bfa; border-color: rgba(167,139,250,.35); }
  .badge.err { color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #04121c; }
  .btn.big { padding: 13px 22px; font-size: 15px; }
  .btn.ghost { background: transparent; }
  .btn.danger { background: transparent; color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .empty { padding: 56px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
  .loading { color: var(--muted); padding: 32px 0; text-align: center; }
  .note { margin: 12px 0; padding: 10px 14px; border-radius: 10px; font-size: 13px; background: rgba(41,181,232,.08); color: #bae6fd; }
  .note.err { background: rgba(239,68,68,.1); color: #fca5a5; }

  /* Preview */
  .back { margin-bottom: 16px; }
  .langs { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); margin-bottom: 18px; }
  .langs button { padding: 6px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: #04121c; }
  .reader h1 { margin: 6px 0 12px; font-size: 30px; line-height: 1.2; letter-spacing: -.02em; }
  .reader .summary { font-size: 18px; color: var(--text); margin: 0 0 22px; }
  .reader p, .reader li { color: #cbd5e1; font-size: 16px; line-height: 1.8; }
  .reader h2 { margin: 30px 0 10px; font-size: 21px; }
  .reader h3 { margin: 24px 0 8px; font-size: 17px; }
  .reader blockquote { margin: 22px 0; padding: 12px 18px; border-left: 3px solid var(--accent); background: rgba(41,181,232,.07); border-radius: 0 10px 10px 0; font-weight: 600; }
  .reader a { text-decoration: underline; text-underline-offset: 3px; }
  .reader .tbl { overflow-x: auto; margin: 22px 0; border: 1px solid var(--line); border-radius: 10px; }
  .reader table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .reader th, .reader td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; color: #cbd5e1; }
  .reader th { color: var(--text); background: var(--panel-2); }
  .reader figure { margin: 0 0 22px; }
  .reader figure img { width: 100%; border-radius: 14px; border: 1px solid var(--line); display: block; }
  .reader figcaption { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .linked-img { margin: 0 0 22px; padding: 16px; border: 1px dashed rgba(41,181,232,.4); border-radius: 12px; color: var(--muted); font-size: 13px; }
  .editlinks { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .src { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; }
  .src a { color: var(--text); word-break: break-all; }
  .src .btn { margin-left: auto; padding: 5px 12px; font-size: 12px; }
  .badge.html { color: #86efac; border-color: rgba(34,197,94,.4); }
  .badge.doc { color: #fcd34d; border-color: rgba(251,191,36,.4); }
  select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 14px 24px; background: rgba(11,17,32,.96); border-top: 1px solid var(--line); }
  .bar .inner { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .bar .hint { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  .sendback { width: 100%; }
  textarea { width: 100%; min-height: 70px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .done { text-align: center; padding: 56px 16px; }
  .done .check { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: rgba(34,197,94,.14); color: var(--ok); }
  .done h2 { margin: 0 0 6px; }
  .done p { color: var(--muted); margin: 0 0 22px; }

  /* Requests */
  .req { display: block; }
  .req .reason { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); white-space: pre-wrap; font-size: 14px; }
  .req .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .req .row .push { margin-left: auto; display: flex; gap: 8px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .code { font: 700 22px/1.4 ui-monospace, Consolas, monospace; letter-spacing: 3px; padding: 12px; margin: 12px 0; border-radius: 10px; background: var(--bg); text-align: center; }
  .section-title { margin: 24px 0 10px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .rank { margin-bottom: 12px; }
  .rank:last-child { margin-bottom: 0; }
  .rank-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .rank-bar { height: 6px; margin-top: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .rank-bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 9; padding: 10px 16px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #toast.error { border-color: rgba(239,68,68,.5); color: #fca5a5; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); max-width: 420px; padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 8px; font-size: 17px; }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  @media (max-width: 640px) { main { padding: 16px 16px 140px; } .reader h1 { font-size: 24px; } .bar .btn { flex: 1; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>YNK Staging</h1>
    <div class="sub">Review, then approve to publish on ynk-techusa.com</div>
  </div>
  <div class="right">
    <button class="btn ghost" id="refresh" type="button">Refresh</button>
  </div>
</header>

<main id="main"><p class="loading">Loading...</p></main>
<div id="bar"></div>

<dialog id="dlg">
  <h2 id="dlg-title"></h2>
  <div id="dlg-body"></div>
  <div class="row">
    <button class="btn ghost" id="dlg-cancel" type="button">Cancel</button>
    <button class="btn primary" id="dlg-ok" type="button">Confirm</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
  var TABS = [['review', 'To review'], ['published', 'Published'], ['rejected', 'Backlog'], ['topics', 'Topic ideas'], ['requests', 'Access requests']];
  var state = { tab: 'review', data: null, preview: null, lang: 'en' };
  var main = document.getElementById('main');
  var bar = document.getElementById('bar');

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (k === 'text') el.textContent = v;
      else if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    (children || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function set(el, nodes) { el.replaceChildren.apply(el, nodes.filter(Boolean)); }

  function toast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.className = ''; }, isError ? 7000 : 3500);
  }

  function call(fn, args, button, busyLabel) {
    var label = button ? button.textContent : '';
    if (button) { button.disabled = true; button.textContent = busyLabel || 'Working...'; }
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { toast(err && err.message ? err.message : String(err), true); reject(err); })
        [fn].apply(null, args || []);
    }).finally(function () {
      if (button && button.isConnected) { button.disabled = false; button.textContent = label; }
    });
  }

  function ask(title, bodyNodes, okLabel) {
    var dlg = document.getElementById('dlg');
    document.getElementById('dlg-title').textContent = title;
    set(document.getElementById('dlg-body'), bodyNodes);
    var ok = document.getElementById('dlg-ok');
    var cancel = document.getElementById('dlg-cancel');
    ok.textContent = okLabel || 'Confirm';
    return new Promise(function (resolve) {
      function done(v) { ok.onclick = cancel.onclick = dlg.oncancel = null; if (dlg.open) dlg.close(); resolve(v); }
      ok.onclick = function () { done(true); };
      cancel.onclick = function () { done(false); };
      dlg.oncancel = function () { done(false); };
      dlg.showModal();
    });
  }

  /* ---------- Data ---------- */
  function load() {
    state.preview = null;
    set(bar, []);
    set(main, [h('p', { class: 'loading', text: 'Loading...' })]);
    call('adminLoad').then(function (data) { state.data = data; render(); });
  }

  function replaceItem(kind, item) {
    state.data[kind] = state.data[kind].map(function (x) { return x.id === item.id ? item : x; });
  }

  /* ---------- Lists ---------- */
  function render() {
    set(bar, []);
    var d = state.data;
    var counts = {
      review: d.articles.filter(function (a) { return a.stage === 'review'; }).length,
      topics: d.topics.suggestions.filter(function (s) { return s.status === 'NEW'; }).length,
      requests: d.requests.filter(function (r) { return r.status === 'PENDING'; }).length
    };
    var tabs = h('div', { class: 'tabs', role: 'tablist' }, TABS.map(function (t) {
      return h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(state.tab === t[0]),
        onclick: function () { state.tab = t[0]; render(); } },
        [t[1], h('span', { class: 'count', text: counts[t[0]] ? String(counts[t[0]]) : '' })]);
    }));

    var items;
    if (state.tab === 'topics') {
      set(main, [tabs].concat(topicsView(d.topics)));
      return;
    }
    if (state.tab === 'requests') {
      var order = { PENDING: 0, APPROVED: 1, REJECTED: 2, REVOKED: 3 };
      items = d.requests.slice().sort(function (a, b) { return (order[a.status] - order[b.status]) || (a.submitted < b.submitted ? 1 : -1); }).map(requestCard);
    } else {
      items = d.articles.filter(function (a) { return a.stage === state.tab; }).map(articleCard);
    }
    var emptyText = { review: 'Nothing waiting for review. You are all caught up.', published: 'Nothing published yet.', rejected: 'The backlog is empty.', requests: 'No access requests yet.' }[state.tab];
    var notices = [];
    if (state.tab === 'review' && d.drive) {
      if (d.drive.added.length) notices.push(h('div', { class: 'note', text: d.drive.added.length + ' new item(s) found in Google Drive and added for review: ' + d.drive.added.map(function (x) { return x.title; }).join(', ') }));
      if (d.drive.upgraded && d.drive.upgraded.length) notices.push(h('div', { class: 'note', text: 'Switched to the HTML files found in Drive: ' + d.drive.upgraded.map(function (x) { return x.title; }).join(', ') }));
      d.drive.incomplete.forEach(function (x) { notices.push(h('div', { class: 'note err', text: 'Drive folder "' + x.name + '" is missing the ' + x.missing.join(', ') + ' version, so it is not in the list yet.' })); });
      if (d.drive.error) notices.push(h('div', { class: 'note err', text: 'Could not scan Google Drive: ' + d.drive.error }));
    }
    set(main, [tabs].concat(notices, items.length ? items : [h('div', { class: 'empty', text: emptyText })]));
  }

  function topicsView(t) {
    var max = t.ranking.length ? t.ranking[0].count : 1;
    var rank = t.ranking.length
      ? t.ranking.map(function (r) {
          return h('div', { class: 'rank' }, [
            h('div', { class: 'rank-top' }, [h('span', { text: r.topic }), h('strong', { text: String(r.count) })]),
            h('div', { class: 'rank-bar' }, [h('span', { style: 'width:' + Math.max(6, Math.round(r.count / max * 100)) + '%' })])
          ]);
        })
      : [h('div', { class: 'empty', text: 'No topic votes yet. They appear here as visitors use "What should we decode next?" on the homepage.' })];

    var order = { NEW: 0, PLANNED: 1, ARCHIVED: 2 };
    var ideas = t.suggestions.slice().sort(function (a, b) { return order[a.status] - order[b.status]; }).map(function (s) {
      var actions = [];
      if (s.status !== 'PLANNED') actions.push(h('button', { class: 'btn primary', type: 'button', text: 'Plan it', onclick: function (e) { setTopic(s.id, 'PLANNED', e.currentTarget); } }));
      if (s.status !== 'ARCHIVED') actions.push(h('button', { class: 'btn ghost', type: 'button', text: 'Archive', onclick: function (e) { setTopic(s.id, 'ARCHIVED', e.currentTarget); } }));
      return h('div', { class: 'card req' }, [
        h('h3', { text: s.custom }),
        h('div', { class: 'meta' }, [
          h('span', { class: 'badge', text: s.status === 'NEW' ? 'New' : s.status === 'PLANNED' ? 'Planned' : 'Archived' }),
          s.audience ? h('span', { text: s.audience }) : null,
          s.email ? h('a', { href: 'mailto:' + s.email, text: s.email }) : null,
          h('span', { text: s.submitted })
        ]),
        s.topics ? h('p', { class: 'meta', text: 'Also picked: ' + s.topics }) : null,
        h('div', { class: 'row' }, [h('div', { class: 'push' }, actions)])
      ]);
    });

    return [
      h('p', { class: 'meta', text: t.total + ' submission(s) in total. Ranking covers the last 90 days.' }),
      h('h2', { class: 'section-title', text: 'Most requested topics' }),
      h('div', { class: 'card req' }, rank),
      h('h2', { class: 'section-title', text: 'Suggested by visitors' })
    ].concat(ideas.length ? ideas : [h('div', { class: 'empty', text: 'No custom suggestions yet.' })]);
  }

  function setTopic(id, status, btn) {
    call('adminSetTopicStatus', [id, status], btn).then(function (topics) {
      state.data.topics = topics;
      render();
      toast(status === 'PLANNED' ? 'Marked as planned.' : 'Archived.');
    });
  }

  function typeBadge(type) {
    return h('span', { class: 'badge ' + (type === 'Study' ? 'study' : 'article'), text: type });
  }

  function articleCard(a) {
    var right = a.stage === 'published'
      ? (a.liveUrl ? h('a', { class: 'btn', href: a.liveUrl, target: '_blank', rel: 'noopener', text: 'View on site' }) : null)
      : h('button', { class: 'btn primary', type: 'button', text: a.stage === 'rejected' ? 'Review again' : 'Review' });
    var card = h('div', { class: 'card' + (a.stage === 'published' ? '' : ' click') }, [
      h('div', { class: 'grow' }, [
        h('h3', { text: a.title }),
        h('div', { class: 'meta' }, [typeBadge(a.type), a.date ? h('span', { text: a.date }) : null,
          a.stage === 'review' && a.syncState === 'SYNC_ERROR' ? h('span', { class: 'badge err', text: 'Needs attention' }) : null])
      ]),
      right
    ]);
    if (a.stage !== 'published') card.addEventListener('click', function () { openPreview(a); });
    return card;
  }

  /* ---------- Preview ---------- */
  function openPreview(a) {
    state.preview = { article: a, data: null };
    state.lang = 'en';
    window.scrollTo(0, 0);
    set(bar, []);
    set(main, [backButton(), h('h2', { text: a.title }), h('p', { class: 'loading', text: 'Preparing preview from Google Drive...' })]);
    call('adminPreview', [a.id]).then(function (p) {
      if (!state.preview || state.preview.article.id !== a.id) return;
      state.preview.data = p;
      renderPreview();
    }).catch(function (err) {
      set(main, [backButton(), h('div', { class: 'note err', text: 'The preview could not be built: ' + (err && err.message ? err.message : String(err)) })]);
    });
  }

  function backButton() {
    return h('button', { class: 'btn ghost back', type: 'button', text: 'Back to list', onclick: function () { state.preview = null; render(); } });
  }

  function renderPreview() {
    var a = state.preview.article;
    var p = state.preview.data;
    var ed = p.editions[state.lang];
    var langs = h('div', { class: 'langs' }, ['en', 'fr', 'es'].map(function (l) {
      return h('button', { type: 'button', 'aria-pressed': String(state.lang === l), text: l.toUpperCase(),
        onclick: function () { state.lang = l; renderPreview(); } });
    }));

    var hero = null;
    if (p.hero) {
      var alt = (p.hero.alt && (p.hero.alt[state.lang] || p.hero.alt.en)) || '';
      var cap = p.hero.caption ? (p.hero.caption[state.lang] || p.hero.caption.en) : '';
      hero = p.hero.src
        ? h('figure', {}, [h('img', { src: p.hero.src, alt: alt }), h('figcaption', { text: [cap, p.hero.credit ? 'Image: ' + p.hero.credit : ''].filter(Boolean).join(' | ') })])
        : h('div', { class: 'linked-img', text: 'Image shown as a link to its original source (rights not cleared): ' + (cap || alt) });
    }

    function rich(tag, b) {
      if (!b.runs) return h(tag, { text: b.text });
      return h(tag, {}, b.runs.map(function (r) {
        var node = h(r.bold ? 'strong' : r.italic ? 'em' : 'span', { text: r.text });
        return r.href && /^https:\/\//i.test(r.href) ? h('a', { href: r.href, target: '_blank', rel: 'noopener' }, [node]) : node;
      }));
    }
    var blocks = ed.blocks.map(function (b) {
      if (b.type === 'h2' || b.type === 'h3') return rich(b.type, b);
      if (b.type === 'quote') return rich('blockquote', b);
      if (b.type === 'ul' || b.type === 'ol') return h(b.type, {}, b.items.map(function (i) { return typeof i === 'string' ? h('li', { text: i }) : rich('li', i); }));
      if (b.type === 'img') {
        var src = b.src && p.images ? p.images[b.src] : '';
        if (!src) return b.href ? h('div', { class: 'linked-img' }, ['Image linked to its source: ', h('a', { href: b.href, target: '_blank', rel: 'noopener', text: b.caption || b.alt || b.href })]) : null;
        return h('figure', {}, [h('img', { src: src, alt: b.alt }), (b.caption || b.href) ? h('figcaption', {}, [b.caption || '', b.href ? h('a', { href: b.href, target: '_blank', rel: 'noopener', text: (b.caption ? '  Source' : 'Source') }) : null]) : null]);
      }
      if (b.type === 'table') {
        return h('div', { class: 'tbl' }, [h('table', {}, b.rows.map(function (row, r) {
          return h('tr', {}, row.map(function (c) { return h(b.head && r === 0 ? 'th' : 'td', { text: c }); }));
        }))]);
      }
      return rich('p', b);
    });

    var notes = [];
    if (a.stage === 'review' && a.syncState === 'SYNC_ERROR' && a.error) notes.push(h('div', { class: 'note err', text: 'Last attempt: ' + a.error }));
    if (a.stage === 'rejected' && a.error) notes.push(h('div', { class: 'note', text: a.error }));
    if (p.fixes) notes.push(h('div', { class: 'note', text: p.fixes + ' em dash or emoji character(s) will be cleaned up automatically.' }));
    if (p.imageError) notes.unshift(h('div', { class: 'note err', text: 'Image problem: ' + p.imageError }));

    var sources = p.sources || [];
    var onDocs = sources.filter(function (s) { return !s.missing && !s.html; }).map(function (s) { return s.lang.toUpperCase(); });
    if (onDocs.length && a.stage !== 'published') notes.unshift(h('div', { class: 'note err', text: onDocs.join(', ') + ' still read from a Google Doc. Use "Use HTML file" below to switch.' }));

    var edits = h('div', { class: 'editlinks' }, [h('div', { text: 'Source files. To change the text, edit the file in Drive, then reopen this preview.' })]
      .concat(sources.map(function (s) {
        return h('div', { class: 'src' }, [
          h('strong', { text: s.lang.toUpperCase() }),
          s.missing ? h('span', { class: 'badge err', text: 'Missing' }) : h('span', { class: 'badge ' + (s.html ? 'html' : 'doc'), text: s.html ? 'HTML' : 'Google Doc' }),
          s.url ? h('a', { href: s.url, target: '_blank', rel: 'noopener', text: s.name }) : null,
          a.stage !== 'published' ? h('button', { class: 'btn ghost', type: 'button', text: s.html ? 'Change' : 'Use HTML file', onclick: function (e) { pickSource(a, s.lang, e.currentTarget); } }) : null
        ]);
      })));

    set(main, [
      backButton(),
      langs,
      h('article', { class: 'reader' }, [
        h('div', { class: 'meta' }, [typeBadge(p.type === 'study' ? 'Study' : 'Article'), h('span', { text: p.date })]),
        h('h1', { text: ed.title }),
        hero,
        h('p', { class: 'summary', text: ed.summary })
      ].concat(blocks)),
      edits
    ].concat(notes));

    renderBar(a);
  }

  function pickSource(a, lang, btn) {
    var L = lang.toUpperCase();
    call('adminHtmlOptions', [a.id, lang], btn, 'Searching...').then(function (opts) {
      if (!opts.length) { toast('No ' + L + ' HTML files found in the Drive folders.', true); return; }
      var sel = h('select', {}, opts.map(function (o) {
        return h('option', { value: o.id, text: (o.match ? 'Best match: ' : '') + o.name + '  (' + o.path + ')' });
      }));
      ask('Use which ' + L + ' HTML file?', [h('p', { class: 'meta', text: 'Best matches are listed first.' }), sel], 'Use this file').then(function (ok) {
        if (!ok) return;
        call('adminSetSource', [a.id, lang, sel.value], btn).then(function (updated) {
          replaceItem('articles', updated);
          toast(L + ' now reads from the HTML file.');
          openPreview(updated);
        });
      });
    });
  }

  function renderBar(a) {
    var approve = h('button', { class: 'btn primary big', type: 'button', text: 'Approve and publish', onclick: function () {
      ask('Publish this ' + a.type.toLowerCase() + '?', [
        h('p', { text: a.title }),
        h('p', { class: 'meta', text: 'It goes live on ynk-techusa.com in English, French and Spanish in about 2 minutes.' })
      ], 'Publish').then(function (ok) {
        if (!ok) return;
        call('adminApproveArticle', [a.id], approve, 'Publishing...').then(function (updated) {
          replaceItem('articles', updated);
          showPublished(updated);
        });
      });
    } });
    var sendBack = h('button', { class: 'btn danger big', type: 'button', text: 'Move to backlog', onclick: function () {
      var reason = h('textarea', { placeholder: 'What needs to change? (optional)', maxlength: '500' });
      ask('Move to backlog?', [reason], 'Move to backlog').then(function (ok) {
        if (!ok) return;
        call('adminRejectArticle', [a.id, reason.value], sendBack).then(function (updated) {
          replaceItem('articles', updated);
          toast('Moved to backlog.');
          state.preview = null;
          state.tab = 'review';
          render();
        });
      });
    } });
    set(bar, [h('div', { class: 'bar' }, [h('div', { class: 'inner' }, [
      h('span', { class: 'hint', text: 'Read it in all three languages, then decide.' }),
      sendBack,
      approve
    ])])]);
  }

  function showPublished(a) {
    state.preview = null;
    set(bar, []);
    set(main, [h('div', { class: 'done' }, [
      h('div', { class: 'check', text: '\u2713' }),
      h('h2', { text: 'Published' }),
      h('p', { text: a.title + ' will be live in about 2 minutes.' }),
      h('div', {}, [
        a.liveUrl ? h('a', { class: 'btn primary', href: a.liveUrl, target: '_blank', rel: 'noopener', text: 'View on site' }) : null,
        ' ',
        h('button', { class: 'btn ghost', type: 'button', text: 'Back to list', onclick: function () { state.tab = 'review'; render(); } })
      ])
    ])]);
  }

  /* ---------- Access requests ---------- */
  function requestCard(r) {
    var card = h('div', { class: 'card req' });
    var actions = [];
    if (r.status === 'PENDING') {
      actions.push(h('button', { class: 'btn danger', type: 'button', text: 'Decline', onclick: function (e) {
        var btn = e.currentTarget;
        var reason = h('textarea', { placeholder: 'Reason (optional, included in the email)', maxlength: '500' });
        var notify = h('input', { type: 'checkbox', checked: 'checked' });
        ask('Decline ' + r.name + '?', [reason, h('label', { class: 'inline' }, [notify, 'Email them'])], 'Decline').then(function (ok) {
          if (!ok) return;
          call('adminRejectUser', [r.id, reason.value, notify.checked], btn).then(function (u) { replaceItem('requests', u); render(); toast('Declined.'); });
        });
      } }));
    }
    if (r.status === 'PENDING' || r.status === 'REJECTED') {
      actions.push(h('button', { class: 'btn primary', type: 'button', text: 'Approve', onclick: function (e) {
        var btn = e.currentTarget;
        ask('Approve ' + r.name + '?', [h('p', { class: 'meta', text: 'A 7-day access code for ' + r.industry + ' is emailed to ' + r.email + '.' })], 'Approve').then(function (ok) {
          if (!ok) return;
          call('adminApproveUser', [r.id], btn).then(function (res) {
            replaceItem('requests', res.request);
            render();
            var copy = h('button', { class: 'btn', type: 'button', text: 'Copy code', onclick: function () { navigator.clipboard.writeText(res.code).then(function () { toast('Copied'); }); } });
            ask('Approved', [h('p', { class: 'meta', text: 'Emailed to ' + r.email + '. Valid until ' + res.request.expires + '. Shown only once.' }), h('div', { class: 'code', text: res.code }), copy], 'Done');
          });
        });
      } }));
    }
    if (r.status === 'APPROVED') {
      actions.push(h('button', { class: 'btn danger', type: 'button', text: 'Revoke', onclick: function (e) {
        var btn = e.currentTarget;
        ask('Revoke access for ' + r.name + '?', [h('p', { class: 'meta', text: 'Their code stops working immediately.' })], 'Revoke').then(function (ok) {
          if (!ok) return;
          call('adminRevokeUser', [r.id], btn).then(function (u) { replaceItem('requests', u); render(); toast('Revoked.'); });
        });
      } }));
    }
    var statusText = { PENDING: 'Waiting', APPROVED: r.expired ? 'Expired ' + r.expires : 'Active until ' + r.expires, REJECTED: 'Declined', REVOKED: 'Revoked' }[r.status];
    set(card, [
      h('h3', { text: r.name }),
      h('div', { class: 'meta' }, [h('span', { class: 'badge', text: statusText }), h('a', { href: 'mailto:' + r.email, text: r.email }),
        h('span', { text: r.company }), h('span', { text: r.industry }), h('span', { text: r.submitted })]),
      h('p', { class: 'reason', text: r.reason }),
      r.note ? h('div', { class: 'note', text: 'Note: ' + r.note }) : null,
      h('div', { class: 'row' }, [h('div', { class: 'push' }, actions)])
    ]);
    return card;
  }

  document.getElementById('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
