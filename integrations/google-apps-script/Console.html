<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b1120; --panel: #111a2e; --panel-2: #16213a; --line: rgba(255,255,255,.08);
    --text: #f1f5f9; --muted: #94a3b8; --accent: #29B5E8; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: rgba(11,17,32,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
  header .who { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--text); background: rgba(41,181,232,.14); border-color: rgba(41,181,232,.4); }
  .count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #04121c; font-size: 11px; line-height: 20px; text-align: center; }
  .count:empty, .count[data-zero] { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  .card { padding: 18px 20px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: rgba(34,197,94,.4); }
  .pill.warn { color: var(--warn); border-color: rgba(245,158,11,.4); }
  .pill.bad { color: var(--bad); border-color: rgba(239,68,68,.4); }
  .reason { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); white-space: pre-wrap; }
  .alert { margin-top: 10px; padding: 8px 12px; border-radius: 10px; font-size: 12px; background: rgba(239,68,68,.1); color: #fca5a5; }
  .alert.info { background: rgba(41,181,232,.1); color: #bae6fd; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  button.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  button.btn:disabled { opacity: .5; cursor: progress; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121c; }
  button.danger { color: #fca5a5; border-color: rgba(239,68,68,.4); background: transparent; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .reject-box { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--panel-2); }
  textarea { width: 100%; min-height: 70px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.error { border-color: rgba(239,68,68,.5); color: #fca5a5; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); max-width: 420px; padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 8px; font-size: 16px; }
  .code { font: 700 20px/1.4 ui-monospace, Consolas, monospace; letter-spacing: 2px; padding: 10px 12px; margin: 12px 0; border-radius: 10px; background: var(--bg); text-align: center; }
  .loading { color: var(--muted); padding: 24px 0; }
  @media (max-width: 640px) { main { padding: 16px; } .actions { margin-left: 0; width: 100%; } .actions .btn { flex: 1; } }
</style>
</head>
<body>
<header>
  <h1>YNK Tech Admin</h1>
  <button class="btn" id="refresh" type="button">Refresh</button>
  <a id="sheet" target="_blank" rel="noopener" href="#">Open sheet</a>
  <span class="who" id="who"></span>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="articles" aria-selected="true">Articles <span class="count" id="count-articles"></span></button>
    <button class="tab" role="tab" data-tab="requests" aria-selected="false">Access requests <span class="count" id="count-requests"></span></button>
  </div>
  <div class="filters" id="filters"></div>
  <div id="list"><p class="loading">Loading...</p></div>
</main>

<dialog id="dlg">
  <h2 id="dlg-title"></h2>
  <div id="dlg-body"></div>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="dlg-cancel" type="button">Cancel</button>
    <button class="btn primary" id="dlg-ok" type="button">Confirm</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
  var FILTERS = {
    articles: [['review', 'Needs review'], ['ready', 'Ready to publish'], ['published', 'Published'], ['rejected', 'Rejected']],
    requests: [['PENDING', 'Pending'], ['APPROVED', 'Approved'], ['REJECTED', 'Rejected'], ['REVOKED', 'Revoked']]
  };
  var state = { tab: 'articles', filter: { articles: 'review', requests: 'PENDING' }, data: null };

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') el.textContent = attrs[k];
      else if (k === 'class') el.className = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  function toast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.className = ''; }, isError ? 6000 : 3500);
  }

  function call(fn, args, button) {
    if (button) { button.disabled = true; button.dataset.label = button.textContent; button.textContent = 'Working...'; }
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { toast(err && err.message ? err.message : String(err), true); reject(err); })
        [fn].apply(null, args || []);
    }).finally(function () {
      if (button && button.isConnected) { button.disabled = false; button.textContent = button.dataset.label; }
    });
  }

  function confirmDialog(title, bodyNodes, okLabel) {
    var dlg = document.getElementById('dlg');
    document.getElementById('dlg-title').textContent = title;
    var body = document.getElementById('dlg-body');
    body.replaceChildren.apply(body, bodyNodes);
    var ok = document.getElementById('dlg-ok');
    ok.textContent = okLabel || 'Confirm';
    ok.style.display = '';
    document.getElementById('dlg-cancel').textContent = 'Cancel';
    return new Promise(function (resolve) {
      function done(v) { dlg.close(); ok.onclick = null; document.getElementById('dlg-cancel').onclick = null; resolve(v); }
      ok.onclick = function () { done(true); };
      document.getElementById('dlg-cancel').onclick = function () { done(false); };
      dlg.oncancel = function () { resolve(false); };
      dlg.showModal();
    });
  }

  function showCode(name, code, expires) {
    var copy = h('button', { class: 'btn', type: 'button', text: 'Copy code', onclick: function () {
      navigator.clipboard.writeText(code).then(function () { toast('Code copied'); });
    } });
    confirmDialog('Approved: ' + name, [
      h('p', { class: 'meta', text: 'The code was emailed to the requester. It is shown only once and expires ' + expires + '.' }),
      h('div', { class: 'code', text: code }),
      copy
    ], 'Done').then(function () {});
    document.getElementById('dlg-cancel').textContent = 'Close';
  }

  function load() {
    document.getElementById('list').replaceChildren(h('p', { class: 'loading', text: 'Loading...' }));
    call('adminLoad').then(function (data) {
      state.data = data;
      document.getElementById('who').textContent = data.user;
      document.getElementById('sheet').href = data.sheetUrl;
      render();
    });
  }

  function replaceItem(kind, item) {
    var arr = state.data[kind];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === item.id) arr[i] = item;
    render();
  }

  function render() {
    var d = state.data;
    if (!d) return;
    var pendingA = d.articles.filter(function (a) { return a.stage === 'review' || a.stage === 'ready'; }).length;
    var pendingR = d.requests.filter(function (r) { return r.status === 'PENDING'; }).length;
    setCount('count-articles', pendingA);
    setCount('count-requests', pendingR);

    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)); });

    var counts = {};
    (state.tab === 'articles' ? d.articles.map(function (a) { return a.stage; }) : d.requests.map(function (r) { return r.status; }))
      .forEach(function (k) { counts[k] = (counts[k] || 0) + 1; });
    var filters = document.getElementById('filters');
    filters.replaceChildren.apply(filters, FILTERS[state.tab].map(function (f) {
      return h('button', { class: 'chip', type: 'button', 'aria-pressed': String(state.filter[state.tab] === f[0]),
        text: f[1] + ' (' + (counts[f[0]] || 0) + ')',
        onclick: function () { state.filter[state.tab] = f[0]; render(); } });
    }));

    var list = document.getElementById('list');
    var items = state.tab === 'articles'
      ? d.articles.filter(function (a) { return a.stage === state.filter.articles; }).map(articleCard)
      : d.requests.filter(function (r) { return r.status === state.filter.requests; }).slice().reverse().map(requestCard);
    list.replaceChildren.apply(list, items.length ? items : [h('div', { class: 'empty', text: 'Nothing here. All caught up.' })]);
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    el.textContent = n ? String(n) : '';
    if (n) el.removeAttribute('data-zero'); else el.setAttribute('data-zero', '');
  }

  function rejectBox(onConfirm, withNotify) {
    var text = h('textarea', { placeholder: withNotify ? 'Reason (optional, included in the email)' : 'Reason (optional, saved in the sheet)', maxlength: '500' });
    var notify = withNotify ? h('input', { type: 'checkbox', checked: 'checked' }) : null;
    var box = h('div', { class: 'reject-box' }, [
      text,
      h('div', { class: 'row' }, [
        notify ? h('label', { class: 'inline' }, [notify, 'Email the requester']) : null,
        h('div', { class: 'actions' }, [
          h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: function () { box.remove(); } }),
          h('button', { class: 'btn danger', type: 'button', text: 'Confirm reject', onclick: function (e) {
            onConfirm(text.value, notify ? notify.checked : false, e.currentTarget);
          } })
        ])
      ])
    ]);
    return box;
  }

  function articleCard(a) {
    var card = h('div', { class: 'card' });
    var docLinks = ['en', 'fr', 'es'].filter(function (l) { return a.docs[l]; }).map(function (l) {
      return h('a', { href: a.docs[l], target: '_blank', rel: 'noopener', text: l.toUpperCase() + ' doc' });
    });
    var reviews = a.reviews.map(function (r) {
      return h('span', { class: 'pill ' + (r.passed ? 'ok' : 'warn'), text: r.name + ': ' + (r.value || 'pending') });
    });

    var actions = [];
    if (a.stage === 'review') {
      actions.push(h('button', { class: 'btn danger', type: 'button', text: 'Reject', onclick: function () { openReject(); } }));
      actions.push(h('button', { class: 'btn primary', type: 'button', text: 'Approve', onclick: function (e) {
        var btn = e.currentTarget;
        confirmDialog('Approve this article?', [
          h('p', { text: a.title }),
          h('p', { class: 'meta', text: 'All three reviews will be marked as passed and a pull request will be opened on GitHub. Nothing goes live until you click Publish.' })
        ], 'Approve').then(function (ok) {
          if (!ok) return;
          call('adminApproveArticle', [a.id], btn).then(function (updated) {
            replaceItem('articles', updated);
            toast(updated.stage === 'ready' ? 'Approved. Pull request opened, ready to publish.' : 'Approved. ' + (updated.error || 'It will sync on the next hourly run.'));
          });
        });
      } }));
    } else if (a.stage === 'ready') {
      actions.push(h('button', { class: 'btn danger', type: 'button', text: 'Reject', onclick: function () { openReject(); } }));
      if (a.prUrl) actions.push(h('a', { class: 'btn', href: a.prUrl, target: '_blank', rel: 'noopener', text: 'Review changes' }));
      actions.push(h('button', { class: 'btn primary', type: 'button', text: 'Publish', onclick: function (e) {
        var btn = e.currentTarget;
        confirmDialog('Publish to ynk-techusa.com?', [
          h('p', { text: a.title }),
          h('p', { class: 'meta', text: 'The pull request is merged and the site redeploys in about 2 minutes. If the content checks fail, the live site stays unchanged.' })
        ], 'Publish').then(function (ok) {
          if (!ok) return;
          call('adminPublishArticle', [a.id], btn).then(function (updated) {
            replaceItem('articles', updated);
            toast('Published. Live in about 2 minutes.');
          });
        });
      } }));
    } else if (a.stage === 'published' && a.liveUrl) {
      actions.push(h('a', { class: 'btn', href: a.liveUrl, target: '_blank', rel: 'noopener', text: 'View live' }));
    }

    function openReject() {
      if (card.querySelector('.reject-box')) return;
      card.appendChild(rejectBox(function (note, _notify, btn) {
        call('adminRejectArticle', [a.id, note], btn).then(function (updated) {
          replaceItem('articles', updated);
          toast('Article rejected.');
        });
      }, false));
    }

    card.append(
      h('h3', { text: a.title }),
      h('div', { class: 'meta' }, [h('span', { text: a.id }), a.date ? h('span', { text: a.date }) : null].concat(docLinks)),
      h('div', { class: 'row' }, reviews.concat([h('div', { class: 'actions' }, actions)]))
    );
    if (a.error) card.appendChild(h('div', { class: 'alert' + (a.stage === 'rejected' ? ' info' : ''), text: a.error }));
    return card;
  }

  function requestCard(r) {
    var card = h('div', { class: 'card' });
    var actions = [];
    if (r.status === 'PENDING' || r.status === 'REJECTED') {
      if (r.status === 'PENDING') actions.push(h('button', { class: 'btn danger', type: 'button', text: 'Reject', onclick: function () {
        if (card.querySelector('.reject-box')) return;
        card.appendChild(rejectBox(function (note, notify, btn) {
          call('adminRejectUser', [r.id, note, notify], btn).then(function (updated) {
            replaceItem('requests', updated);
            toast('Request rejected.');
          });
        }, true));
      } }));
      actions.push(h('button', { class: 'btn primary', type: 'button', text: 'Approve', onclick: function (e) {
        var btn = e.currentTarget;
        confirmDialog('Approve ' + r.name + '?', [
          h('p', { class: 'meta', text: 'A 7-day access code for ' + r.industry + ' will be emailed to ' + r.email + '.' })
        ], 'Approve and email code').then(function (ok) {
          if (!ok) return;
          call('adminApproveUser', [r.id], btn).then(function (res) {
            replaceItem('requests', res.request);
            showCode(r.name, res.code, res.request.expires);
          });
        });
      } }));
    } else if (r.status === 'APPROVED') {
      actions.push(h('button', { class: 'btn danger', type: 'button', text: 'Revoke access', onclick: function (e) {
        var btn = e.currentTarget;
        confirmDialog('Revoke access for ' + r.name + '?', [h('p', { class: 'meta', text: 'Their code stops working immediately.' })], 'Revoke').then(function (ok) {
          if (!ok) return;
          call('adminRevokeUser', [r.id], btn).then(function (updated) { replaceItem('requests', updated); toast('Access revoked.'); });
        });
      } }));
    }

    var statusPill = r.status === 'APPROVED'
      ? h('span', { class: 'pill ' + (r.expired ? 'warn' : 'ok'), text: r.expired ? 'Expired ' + r.expires : 'Active until ' + r.expires })
      : null;

    card.append(
      h('h3', { text: r.name }),
      h('div', { class: 'meta' }, [
        h('a', { href: 'mailto:' + r.email, text: r.email }),
        h('span', { text: r.company }),
        h('span', { text: r.industry }),
        h('span', { text: 'Submitted ' + r.submitted })
      ]),
      h('p', { class: 'reason', text: r.reason }),
      h('div', { class: 'row' }, [statusPill, h('div', { class: 'actions' }, actions)])
    );
    if (r.note) card.appendChild(h('div', { class: 'alert info', text: 'Note: ' + r.note }));
    return card;
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { state.tab = t.dataset.tab; render(); });
  });
  document.getElementById('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
