name: Validate Intelligence content

on:
  pull_request:
    branches: [main]
    paths:
      - 'ynk-react/public/intelligence/**'
      - 'ynk-react/scripts/intelligence.mjs'
      - 'ynk-react/src/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ynk-react/package-lock.json

      - name: Check content (JSON, EN/FR/ES editions, images, sources, em dashes)
        working-directory: ynk-react
        run: npm run validate:intelligence

      - name: Install dependencies
        working-directory: ynk-react
        run: npm ci

      - name: Production build
        working-directory: ynk-react
        run: npm run build
