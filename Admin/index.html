<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YNK Admin</title>
<style>

  h1 { margin: 0 0 6px; color: #f1f5f9; font-size: 22px; }

  .btn { display: block; padding: 13px 18px; border-radius: 12px; background: #29B5E8; color: #04121c; font-weight: 700; text-decoration: none; }
  .btn:hover { background: #5ccef5; }
  .alt { display: block; margin-top: 14px; font-size: 13px; color: #29B5E8; }
  .note { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; }
  .home { color: #64748b; }
</style>
</head>
<body>
  <main class="card">

    <a class="btn" href="https://script.google.com/macros/s/AKfycbxOyvd-e0vRvpBbbjM5Crz-V32NfgXHDUYDPnHIHnXX/dev" rel="noopener noreferrer">Open YNK Staging</a>
    <a class="alt" href="https://script.google.com/macros/u/1/s/AKfycbxOyvd-e0vRvpBbbjM5Crz-V32NfgXHDUYDPnHIHnXX/dev" rel="noopener noreferrer">Signed in to several Google accounts? Use this link</a>
    <p class="note">Sign-in is handled by Google. Only the YNK Tech admin account can open the staging area.<br><a class="home" href="/">Back to ynk-techusa.com</a></p>
  </main>
